  <link rel="stylesheet" href="style.css" />
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; }
    nav { flex: 0 0 auto; }
    .cv-meta {
      flex: 0 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem 1.5rem;
      padding: 0.7rem 2rem;
      background: #fafafa;
      border-bottom: 1px solid #eaeaea;
      font-size: 0.9rem;
      color: #555;
    }
    .cv-meta a { color: #333; font-weight: 500; text-decoration: none; border-bottom: 1px solid #ccc; transition: color 0.3s ease; }
    .cv-meta a:hover { color: #888; }
    .cv-frame { flex: 1 1 auto; min-height: 0; }
    .cv-frame iframe { display: block; width: 100%; height: 100%; border: 0; }

    /* Mobile browsers render only the first page of a PDF in an iframe,
       so small screens get page images instead. Regenerate them whenever
       the PDF changes:
       pdftocairo -png -r 150 -scale-to-x 1240 -scale-to-y -1 "<cv>.pdf" page
       cwebp -q 82 page-N.png -o assets/images/cv-page-N.webp */
    .cv-pages { display: none; background: #f4f4f4; padding: 1rem; }
    .cv-pages img {
      display: block;
      width: 100%;
      height: auto;
      margin: 0 auto 1rem auto;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .cv-pages img:last-child { margin-bottom: 0; }

    @media (max-width: 768px) {
      .cv-meta { padding: 0.7rem 1.5rem; }
      html, body { height: auto; }
      .cv-frame { display: none; }
      .cv-pages { display: block; }
    }
    @media (max-width: 480px) {
      .cv-meta { padding: 0.7rem 1rem; }
      .cv-pages { padding: 0.5rem; }
    }
  </style>
</head>
